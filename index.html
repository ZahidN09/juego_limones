<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrapar Limones</title>
  <link rel="stylesheet" href="limones.css"/>
</head>
<body onload="iniciar()">
  <div class="grid-tech"></div>
  <div class="web-corner web-corner--tl"></div>
  <div class="web-corner web-corner--br"></div>

  <main class="contenedor">
    <div class="status-line">
      <span><i></i> SISTEMA ACTIVO</span>
      <span>JUEGO // 01</span>
    </div>

    <header class="encabezado">
      <div class="icono">
        <!-- Logo original, sin filtros ni modificaciones -->
        <img src="logo.png" alt="Logo araña" class="spider-logo"/>
        <b>01</b>
      </div>
      <div>
        <p class="etiqueta">ARCADE // HABILIDAD</p>
        <h1>Atrapar Limones</h1>
        <p class="subtitulo">Si del cielo te caen limones... ¡atrápalos todos!</p>
        <h2>Autor: Zahid Nazate</h2>
      </div>
    </header>

    <section class="zona-juego">
      <div class="marco-canvas">
        <div class="barra-superior">
          <span>🍋 Caza limones</span>
          <span class="indicador">● EN JUEGO</span>
        </div>
        <canvas id="areaJuego" width="600" height="400"></canvas>
      </div>

      <div class="panel" aria-label="Marcador">
        <div class="estadistica">
          <span class="estadistica-icono">🏆</span>
          <div>
            <span class="etiqueta-estadistica">PUNTAJE</span>
            <strong id="txtPuntaje">0</strong>
          </div>
        </div>
        <div class="separador"></div>
        <div class="estadistica">
          <span class="estadistica-icono">❤️</span>
          <div>
            <span class="etiqueta-estadistica">VIDAS</span>
            <strong id="txtVidas">3</strong>
          </div>
        </div>
      </div>

      <div class="botones">
        <button class="btn btn-movimiento" onclick="moverIzquierda()">← Izquierda</button>
        <button class="btn btn-movimiento" onclick="moverDerecha()">Derecha →</button>
        <button class="btn btn-reiniciar" onclick="reiniciar()">↻ Reiniciar</button>
      </div>

      <div class="teclas">
        <span>CONTROLES</span>
        <kbd>←</kbd><kbd>→</kbd>
        <em>MOVER</em>
      </div>
      <p class="ayuda">Atrapa los limones. Evita que caigan. Consigue la máxima puntuación.</p>
    </section>
  </main>

  <script src="limones.js"></script>
  <script src="utils.js"></script>
</body>
</html>
